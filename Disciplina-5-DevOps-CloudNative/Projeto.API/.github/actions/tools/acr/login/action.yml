name: Azure Container Registry Login
description: Authenticates Docker with Azure Container Registry after Azure OIDC login

inputs:
  registry:
    description: 'Azure Container Registry login server (e.g., myregistry.azurecr.io)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Log in to Azure Container Registry
      shell: bash
      run: |
        set -euo pipefail
        ACR_NAME="${{ inputs.registry }}"
        ACR_NAME="${ACR_NAME%%.*}"
        az acr login --name "$ACR_NAME"
