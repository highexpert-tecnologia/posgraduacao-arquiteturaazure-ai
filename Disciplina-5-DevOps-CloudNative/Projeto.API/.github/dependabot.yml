version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "cron"
      cron: "0 11 * * 1"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "[nuget]: "

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "[github-actions]: "
